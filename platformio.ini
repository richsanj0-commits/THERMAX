; PlatformIO Project Configuration File
; EV Battery Project - Multi-Target (Arduino Nano + ESP32 Web Server)

[platformio]
default_envs = nanoatmega328

; =============================================================
; ESP32 WiFi & Web Dashboard Receiver (COM9)
; =============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<esp32_main.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_port = COM9
monitor_port = COM9
upload_speed = 921600


; =============================================================
; Arduino Nano Sensor Aggregator (COM8)
; =============================================================
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = +<nano_main.cpp>

monitor_speed = 115200
; Port auto-detected (COM number changes when the USB port changes)
; upload_port = COM8
; monitor_port = COM8

lib_deps = 
    adafruit/MAX6675 library @ ^1.1.2
